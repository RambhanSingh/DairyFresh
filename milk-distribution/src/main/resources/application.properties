spring.application.name=DairyFresh

# Only reachable from this laptop (not from Wi-Fi / network / internet)
server.address=127.0.0.1
server.port=8080

# Data is stored in the ./data folder next to the app (file database, no install needed)
spring.datasource.url=jdbc:h2:file:./data/milkdb
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

spring.thymeleaf.cache=true

# Dates in forms and links are always yyyy-MM-dd
spring.mvc.format.date=iso
